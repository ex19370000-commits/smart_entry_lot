services:
  - type: web
    name: smart_entry_lot # アプリ名（任意）
    env: ruby
    buildCommand: "./bin/render-build.sh"
    startCommand: "bundle exec puma -C config/puma.rb"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: smart_entry_lot_db
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false
      - key: NODE_VERSION
        value: 20.x # Dockerfileの設定に合わせる

databases:
  - name: smart_entry_lot_db
    databaseName: smart_entry_lot
    user: postgres
    plan: free # 無料プランを指定