default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: postgres
  password: <%= ENV.fetch("DATABASE_PASSWORD") { 'password' } %>
  host: db

development:
  <<: *default
  database: smart_entry_lot_development

test:
  <<: *default
  database: smart_entry_lot_test