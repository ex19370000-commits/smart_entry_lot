default: &default
  adapter: mysql2
  encoding: utf8mb4
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: root
  password: <%= ENV.fetch("DATABASE_PASSWORD") { 'password' } %>
  host: db

development:
  <<: *default
  database: smart_entry_lot_development

test:
  <<: *default
  database: smart_entry_lot_test